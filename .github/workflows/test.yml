name: tests
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Syntax checks
        run: npm run check
      - name: Core, API and UI smoke tests
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight image test dependency
        run: python -m pip install 'Pillow>=10,<13'
      - name: Parse local model server
        run: python -m compileall -q server tests/test_local_ai.py
      - name: Test local model input validation without GPU
        run: python -m unittest discover -s tests -p 'test_local_ai.py' -v
      - name: Live Panoramax integration (external service, non-gating)
        continue-on-error: true
        env:
          PANORAMAX_LIVE: '1'
        run: node --test tests/live-panoramax.test.mjs
      - name: Static entrypoint checks
        run: |
          test -f index.html
          test -f src/app.mjs
          test -f src/compositor.mjs
          test -f src/scenes.mjs
          test -f api/scenes.js
          test -f api/scene-image.js
          test -f src/panoramax.mjs
          test -f api/panoramax-scenes.js
          test -f api/panoramax-image.js
          test -f src/depth.mjs
          test -f src/depth-ui.mjs
          test -f src/cutout.mjs
          test -f api/depth.js
          test -f api/depth-health.js
          test -f api/render.js
          test -f server/local_ai.py


  browser:
    # Playwright 1.57.0 does not support GitHub's Ubuntu 26.04 latest image.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chromium test runner
        run: |
          python -m pip install 'playwright==1.57.0'
          python -m playwright install --with-deps chromium
      - name: Offline local-photo browser E2E
        run: python -m unittest discover -s tests -p 'test_browser_e2e.py' -v
