name: tests
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Syntax checks
        run: npm run check
      - name: Core, API and UI smoke tests
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Parse local model server
        run: python -m compileall -q server tests/test_local_ai.py
      - name: Test local model input validation without GPU
        run: python -m unittest discover -s tests -p 'test_local_ai.py' -v
      - name: Static entrypoint checks
        run: |
          test -f index.html
          test -f src/app.mjs
          test -f api/render.js
          test -f server/local_ai.py
